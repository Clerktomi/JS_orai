<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
<div class="container">
    <p id="eredmeny"></p>
    <input type="text" id="nev" placeholder="Következő név:" class="form-control w-50">
    <button id="gomb" class="my-2 btn btn-primary w-25">Add</button>
    <!-- <p id="diakokelem"></p> -->
    <ul id="diakokelem">

    </ul>
</div>

    <script>
        const gomb = document.getElementById("gomb");
        const diakokelem = document.getElementById("diakokelem");
        const eredmeny = document.getElementById("eredmeny");

        let diakok = ["Anna","Bence"];

        let keszNevek = [];

        function megjelenit(lista){
            diakokelem.textContent = "";
            
            lista.forEach(elem => {
                let torles = document.createElement("button");
                torles.textContent = "Törlés";
                torles.classList = "btn btn-danger mx-1";
                
                let keszGomb = document.createElement("button");
                keszGomb.textContent = "Kész";
                keszGomb.classList = "btn btn-success mx-1";

                let uj = document.createElement("li");
                uj.classList = "my-2";
                uj.textContent = elem;
                uj.appendChild(keszGomb);
                uj.appendChild(torles);
                
                diakokelem.appendChild(uj);

                torles.addEventListener("click",function(){
                    diakokelem.removeChild(uj);
                });
                keszGomb.addEventListener("click",function(){
                    if(!keszNevek.includes(elem)){
                        keszNevek.push(elem);
                        alert(keszNevek);
                    }
                });
            });
            
        }

        megjelenit(diakok);

        gomb.addEventListener("click",()=>{
            let ertek = document.getElementById("nev").value;
            if(!diakok.includes(ertek)&&ertek!=""){
                diakok=[...diakok,ertek];
                megjelenit(diakok);
                document.getElementById("nev").value = "";
            } else{
                alert("Hé haver! benne van a listában!");
            }
        });
    </script>
</body>
</html>
